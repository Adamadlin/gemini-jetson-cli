[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-jetson-cli"
version = "0.1.0"
description = "Python-based AI assistant for Jetson diagnostics, planning, and repair workflows."
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich"
]

[project.scripts]
jetson-ai = "jetson_ai.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["jetson_ai*"]
